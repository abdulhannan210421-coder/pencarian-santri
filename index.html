<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Data Santri</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <div id="scrollableArea" class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-6 my-2">
        <div class="flex justify-between items-center mb-4">
            <span id="cacheBadge" class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded"></span>
            <button onclick="forceRefreshData()" class="text-xs text-gray-500 hover:text-gray-700">🔄 Update Data Terbaru</button>
        </div>
        
        <h1 class="text-2xl md:text-5xl font-bold text-center text-emerald-700 mb-2">Pencarian Data Santri</h1>
        <p class="text-center text-gray-500 mb-6">Cari berdasarkan <strong>ID PPS</strong> atau <strong>Nama Santri</strong></p>

        <div class="flex gap-2 mb-2">
            <input type="text" id="searchInput" placeholder="Ketik minimal 3 huruf atau ID PPS..." 
                class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
                onkeyup="handleKeyPress(event)">
            <button onclick="lakukanPencarianFast(true)" id="searchBtn" 
                class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">Cari</button>
        </div>
        <p class="text-xs text-gray-400 mb-6">*Pencarian otomatis berjalan jika mengetik minimal 3 karakter / ID lengkap.</p>

        <div id="loading" class="text-center py-6 text-semibold flex items-center justify-center gap-2">
            <svg class="animate-spin h-5 w-5 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="loadingText">Memuat data santri...</span>
        </div>

        <div id="infoMessage" class="mb-4"></div>
        <div id="resultContainer" class="space-y-6"></div>
    </div>

    <!-- Modal Foto Santri -->
    <div id="photoModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl flex flex-col items-center">
            <div class="w-full flex justify-between items-center p-4 border-b">
                <h3 class="font-bold text-gray-800">Foto Santri</h3>
                <button onclick="closePhotoModal()" class="text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center font-bold">✕</button>
            </div>
            <div class="p-6 w-full flex flex-col items-center justify-center relative min-h-[250px] bg-slate-100">
                <div id="photoLoading" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-100">
                    <svg class="animate-spin h-8 w-8 text-emerald-600 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-xs text-gray-500">Memuat foto terbaru...</span>
                </div>
                <img id="santriImg" class="w-full max-h-[350px] object-contain rounded hidden" onload="onImageLoaded()" onerror="onImageError()">
                <div id="photoError" class="hidden text-center p-4">
                    <p class="text-sm font-semibold text-gray-600">Foto tidak ditemukan</p>
                    <p class="text-xs text-gray-400 mt-1">Belum ada foto yang diunggah untuk ID PPS ini.</p>
                </div>
            </div>
            <div class="p-4 bg-slate-50 w-full text-center">
                <button onclick="closePhotoModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2.5 rounded-xl font-medium transition text-sm">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzpmjBCV-wmn-tr3RGh3RvD35LIXgnapi2c3ZH9OUusrHgN-Ny9wjaFJ9ztczC11mkz1pUrw_sZUYhEF4YY6byRg/exec";

        let DB = {
            headersUtama: [],
            dataUtama: []
        };

        window.onload = function() {
            const localData = localStorage.getItem('SANTRI_DB_CACHE');
            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    initDatabase(parsed, true);
                    return;
                } catch(e) {
                    localStorage.removeItem('SANTRI_DB_CACHE');
                }
            }
            fetchDataFromServer(true);
        };

        function fetchDataFromServer(showLoadingUI) {
            if (showLoadingUI) {
                document.getElementById('loading').classList.remove('hidden');
            }
            fetch(API_URL)
                .then(response => response.json())
                .then(res => {
                    localStorage.setItem('SANTRI_DB_CACHE', JSON.stringify(res));
                    initDatabase(res, false);
                })
                .catch(err => {
                    if (showLoadingUI) {
                        document.getElementById('loadingText').innerText = 'Gagal memuat: ' + err.message;
                    }
                });
        }

        function initDatabase(res, fromCache) {
            DB.headersUtama = res.headersUtama || [];
            DB.dataUtama = res.dataUtama || [];
            
            document.getElementById('loading').classList.add('hidden');
            const badge = document.getElementById('cacheBadge');
            badge.innerText = fromCache ? "⚡ Mode Super Cepat (Cached)" : "✨ Data Diperbarui";
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') lakukanPencarianFast();
            else {
                const val = document.getElementById('searchInput').value.trim();
                if (val.length >= 3) lakukanPencarianFast();
            }
        }

        function lakukanPencarianFast() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('resultContainer');
            const info = document.getElementById('infoMessage');
            
            container.innerHTML = "";
            info.innerHTML = "";

            if (keyword.length < 3) {
                info.innerHTML = `<p class="text-orange-500 text-sm">Ketik minimal 3 huruf untuk mencari.</p>`;
                return;
            }

            const hasil = DB.dataUtama.filter(item => {
                return Object.values(item).some(val => String(val).toLowerCase().includes(keyword));
            }).slice(0, 20); // Batasi 20 hasil teratas agar super cepat

            if (hasil.length === 0) {
                info.innerHTML = `<p class="text-red-500 text-sm">Data tidak ditemukan.</p>`;
                return;
            }

            info.innerHTML = `<p class="text-emerald-600 text-sm font-semibold">Ditemukan ${hasil.length} data:</p>`;

            hasil.forEach(santri => {
                const id_pps = santri["ID PPS"] || "-";
                const nama = santri["Nama"] || santri["NAMA"] || "Tanpa Nama";
                
                const card = document.createElement('div');
                card.className = "p-4 border rounded-xl bg-slate-50 flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <p class="font-bold text-gray-800">${nama}</p>
                        <p class="text-xs text-gray-500">ID PPS: ${id_pps}</p>
                    </div>
                    <button onclick="bukaFoto('${id_pps}')" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700 transition">Lihat Foto</button>
                `;
                container.appendChild(card);
            });
        }

        function bukaFoto(id_pps) {
            const modal = document.getElementById('photoModal');
            const loading = document.getElementById('photoLoading');
            const img = document.getElementById('santriImg');
            const err = document.getElementById('photoError');

            modal.classList.remove('hidden');
            loading.classList.remove('hidden');
            img.classList.add('hidden');
            err.classList.add('hidden');

            const santriPilih = DB.dataUtama.find(item => item["ID PPS"] == id_pps);

            loading.classList.add('hidden');

            if (santriPilih && santriPilih.FOTO && santriPilih.FOTO !== "") {
                img.src = santriPilih.FOTO;
                img.classList.remove('hidden');
            } else {
                showPhotoError("Foto belum tersedia di database.");
            }
        }

        function onImageLoaded() {
            document.getElementById('photoLoading').classList.add('hidden');
            document.getElementById('santriImg').classList.remove('hidden');
        }

        function onImageError() {
            showPhotoError("Gagal memuat file gambar");
        }

        function showPhotoError(msg) {
            document.getElementById('photoLoading').classList.add('hidden');
            document.getElementById('photoError').innerText = msg;
            document.getElementById('photoError').classList.remove('hidden');
        }

        function closePhotoModal() {
            document.getElementById('photoModal').classList.add('hidden');
        }

        function forceRefreshData() {
            localStorage.removeItem('SANTRI_DB_CACHE');
            location.reload();
        }
    </script>
</body>
</html>
