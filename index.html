<!DOCTYPE html>
<html lang="id" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="a8VwvtD9Ecw8vkh2b7S1wVIPnScssr8ODeT2SKiuTmU" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pencarian Data Santri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ANTI PULL-TO-REFRESH */
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    #scrollableArea {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }

    /* ANIMASI BOUNCE UNTUK MODAL FOTO */
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3); }
      50% { opacity: 1; transform: scale(1.05); }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .animate-bounce-modal {
      animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  
    /* ANIMASI FLIP CARD */
    .card-perspective {
      perspective: 1000px;
    }
    .card-flip-container {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }
    .flip-out-left {
      transform: rotateY(-70deg) scale(0.92);
      opacity: 0;
    }
    .flip-in-left {
      transform: rotateY(70deg) scale(0.92);
      opacity: 0;
    }
    .flip-out-right {
      transform: rotateY(70deg) scale(0.92);
      opacity: 0;
    }
    .flip-in-right {
      transform: rotateY(-70deg) scale(0.92);
      opacity: 0;
    }
    
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
  <!-- Wrapper Scroll -->
  <div id="scrollableArea" class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-6 my-2 border border-slate-200">
      
      <!-- Top Action Bar -->
      <div class="flex justify-between items-center mb-4">
        <span id="cacheBadge" class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold hidden">
          ⚡ Data Tersimpan (Instan)
        </span>
        <button onclick="forceRefreshData()" class="text-xs text-slate-400 hover:text-emerald-600 transition flex items-center gap-1 ml-auto">
          🔄 Sync Data
        </button>
      </div>

      <!-- Title -->
      <h1 class="text-2xl font-bold text-center text-emerald-700 tracking-tight">Pencarian Data Santri</h1>
      <p class="text-center text-slate-400 mb-5 text-xs">Ketik minimal 3 karakter ID PPS atau Nama Santri</p>

      <!-- Search Input -->
      <div class="flex gap-2 mb-2">
        <input type="text" id="searchInput" placeholder="Cari ID PPS atau Nama..." 
               class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm disabled:bg-slate-50 text-sm" 
               onkeyup="handleKeyPress(event)" disabled>
        <button onclick="lakukanPencarianFast(true)" id="searchBtn" disabled
                class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-medium text-sm hover:bg-emerald-700 transition shadow-sm disabled:opacity-50">
          Cari
        </button>
      </div>

      <!-- Indicator Loading -->
      <div id="loading" class="text-center py-6 text-emerald-600 font-semibold flex items-center justify-center gap-2">
        <svg class="animate-spin h-5 w-5 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span id="loadingText" class="text-xs">Memuat database...</span>
      </div>

      <!-- Result Container -->
      <div id="infoMessage" class="mt-4"></div>
      <div id="resultContainer" class="mt-3"></div>
    </div>
  </div>

  <!-- MODAL POPUP FOTO SANTRI (BOUNCE) -->
  <div id="photoModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div id="photoModalCard" class="bg-white rounded-2xl max-w-lg w-full p-4 relative shadow-2xl overflow-hidden flex flex-col items-center">
      <!-- Tombol Close -->
      <button onclick="closePhotoModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-full w-8 h-8 flex items-center justify-center font-bold transition z-10">
        ✕
      </button>

      <h3 id="modalName" class="text-base font-bold text-slate-800 text-center pr-6 mb-0.5">Foto Santri</h3>
      <p id="modalPps" class="text-xs text-slate-400 text-center"></p>
      <p id="modalDomisili" class="text-xs text-emerald-600 font-medium mb-3 text-center"></p>

      <!-- Frame Foto Full -->
      <div class="w-full h-96 bg-slate-100 rounded-xl overflow-hidden flex items-center justify-center relative border border-slate-200">
        <div id="photoLoading" class="flex flex-col items-center gap-2 text-emerald-600">
          <svg class="animate-spin h-7 w-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-xs font-medium text-slate-500">Memuat foto...</span>
        </div>

        <img id="santriImg" src="" alt="Foto Santri Full" class="w-full h-full object-contain hidden" onload="onImageLoaded()" onerror="onImageError()" referrerpolicy="no-referrer">
        
        <div id="photoError" class="hidden text-center p-4">
          <p class="text-3xl mb-1">📷</p>
          <p id="photoErrorMsg" class="text-xs font-semibold text-slate-600">Foto tidak ditemukan</p>
        </div>
      </div>

      <button onclick="closePhotoModal()" class="mt-4 w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-2 rounded-xl font-medium transition text-xs">
        Tutup
      </button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzV_l5rAXgnapi2c3ZH90WOusrHgN-Ny9wjaFJ9tczCl1mkz1pURw_sZUYhEF4YY6byRg/exec";

    const scrollArea = document.getElementById('scrollableArea');
    let startY = 0;

    scrollArea.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) startY = e.touches[0].clientY;
    }, { passive: false });

    scrollArea.addEventListener('touchmove', function(e) {
      const currentY = e.touches[0].clientY;
      const distanceY = currentY - startY;
      if (scrollArea.scrollTop <= 0 && distanceY > 0) e.preventDefault();
    }, { passive: false });

    let DB = {
      headersUtama: [],
      dataUtama: [],
      mutaallimMap: {},
      mualimMap: {},
      tahfidzMap: {}
    };

    window.onload = function() {
      const localData = localStorage.getItem('SANTRI_DB_CACHE');
      if (localData) {
        try {
          const parsed = JSON.parse(localData);
          initDatabase(parsed, true);
          return;
        } catch(e) {
          localStorage.removeItem('SANTRI_DB_CACHE');
        }
      }
      fetchDataFromServer(true);
    };

    function fetchDataFromServer(showLoadingUI) {
      if (showLoadingUI) document.getElementById('loading').classList.remove('hidden');

      fetch(API_URL)
        .then(response => response.json())
        .then(res => {
          localStorage.setItem('SANTRI_DB_CACHE', JSON.stringify(res));
          initDatabase(res, false);
        })
        .catch(err => {
          if (showLoadingUI) {
            document.getElementById('loadingText').innerText = 'Gagal memuat data: ' + err.message;
          }
        });
    }

    function forceRefreshData() {
      document.getElementById('loadingText').innerText = "Memperbarui database...";
      document.getElementById('loading').classList.remove('hidden');
      fetchDataFromServer(true);
    }

    function initDatabase(res, isFromCache) {
      DB.headersUtama = res.headersUtama;
      DB.dataUtama = res.dataUtama;
      DB.mutaallimMap = res.mutaallimMap;
      DB.mualimMap = res.mualimMap;
      DB.tahfidzMap = res.tahfidzMap;

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('searchInput').disabled = false;
      document.getElementById('searchBtn').disabled = false;

      if (isFromCache) document.getElementById('cacheBadge').classList.remove('hidden');
    }

    let searchTimeout = null;
    let searchResults = [];
    let currentCardIndex = 0;

    function handleKeyPress(event) {
      clearTimeout(searchTimeout);
      if (event.key === "Enter") {
        lakukanPencarianFast(true);
      } else {
        searchTimeout = setTimeout(() => lakukanPencarianFast(false), 300);
      }
    }

    function lakukanPencarianFast(isForce) {
      const inputEl = document.getElementById('searchInput');
      const keyword = inputEl.value.toLowerCase().trim();
      const container = document.getElementById('resultContainer');
      const infoMsg = document.getElementById('infoMessage');

      container.innerHTML = '';
      infoMsg.innerHTML = '';
      searchResults = [];
      currentCardIndex = 0;

      if (!keyword) return;
      if (!isForce && keyword.length < 3) return;

      container.innerHTML = `<div class="text-center text-emerald-600 py-6 text-xs font-medium animate-pulse">Memproses data...</div>`;

      setTimeout(() => {
        searchResults = DB.dataUtama.filter(row => {
          const idPps = row[0] ? row[0].toLowerCase().trim() : '';
          const nama = row[1] ? row[1].toLowerCase().trim() : '';
          return idPps.includes(keyword) || nama.includes(keyword);
        });

        if (searchResults.length === 0) {
          container.innerHTML = `<div class="text-center text-slate-400 py-8 text-xs border border-dashed border-slate-200 rounded-xl">Data santri tidak ditemukan.</div>`;
          return;
        }

        renderCurrentCard();
      }, 10);
    }

    // ==========================================
    // RENDER KARTU NAMA MINIMALIS
    // ==========================================
    function renderCurrentCard() {
      const container = document.getElementById('resultContainer');
      const infoMsg = document.getElementById('infoMessage');
      
      if (searchResults.length === 0) return;

      const row = searchResults[currentCardIndex];
      const total = searchResults.length;

      // Indicator Jumlah Hasil
      infoMsg.innerHTML = `
        <div class="flex justify-between items-center text-xs text-slate-500 mb-3 px-1">
          <span>Ditemukan <strong>${total}</strong> data</span>
          <span class="bg-emerald-50 text-emerald-700 px-2.5 py-0.5 rounded-full font-semibold border border-emerald-200">
             Kartu ${currentCardIndex + 1} dari ${total}
          </span>
        </div>`;

      const idPps = row[0] ? row[0].trim() : '';
      const nama = row[1] ? row[1].trim() : 'Tanpa Nama';

      // Ambil Kontak
      const indexKontak = DB.headersUtama.findIndex(header => header.toUpperCase() === "KONTAK WALI");
      let infoKontakWali = (indexKontak !== -1) ? row[indexKontak] : "";

      // Ambil Link Foto
      const fotoIndex = DB.headersUtama.findIndex(header => header.toUpperCase() === "FOTO");
      let rawFotoUrl = (fotoIndex !== -1 && row[fotoIndex]) ? row[fotoIndex] : "";
      let safeFotoUrl = getSafeImageUrl(rawFotoUrl);

      // Status Badges
      const isMutaallim = DB.mutaallimMap.hasOwnProperty(idPps);
      const isMualim = DB.mualimMap.hasOwnProperty(idPps);
      const isTahfidz = DB.tahfidzMap.hasOwnProperty(idPps);

      let statusBadges = [];
      if (isMutaallim) statusBadges.push(`<span class="px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-amber-100 text-amber-800 border border-amber-200">Muta'allim</span>`);
      if (isMualim) statusBadges.push(`<span class="px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-blue-100 text-blue-800 border border-blue-200">Mu'allim</span>`);
      if (isTahfidz) statusBadges.push(`<span class="px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200">Tahfidz</span>`);
      if (statusBadges.length === 0) statusBadges.push(`<span class="px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-slate-100 text-slate-600 border border-slate-200">Santri Regular</span>`);

      // List Data Utama (Tanpa Box Kaku)
      let detailUtamaHtml = '';
      DB.headersUtama.forEach((header, idx) => {
        let namaHeader = header.toUpperCase();
        if (namaHeader === "FOTO" || namaHeader === "KONTAK WALI" || namaHeader === "WA" || idx === 0 || idx === 1) return;

        let val = (row[idx] !== "" && row[idx] !== null && row[idx] !== undefined) ? row[idx] : "-";
        detailUtamaHtml += `
          <div class="py-1.5 border-b border-slate-100 flex justify-between items-center text-xs">
            <span class="text-slate-400 font-medium">${header}</span>
            <span class="text-slate-700 font-semibold text-right">${val}</span>
          </div>`;
      });

      // Extra Status Sections
      let statusSectionsHtml = '';
      if (isMutaallim) statusSectionsHtml += buildExtraCardMinimal("Muta'allim", DB.mutaallimMap[idPps], 'bg-amber-50/60 border-amber-100 text-amber-900');
      if (isMualim) statusSectionsHtml += buildExtraCardMinimal("Mu'allim", DB.mualimMap[idPps], 'bg-blue-50/60 border-blue-100 text-blue-900');
      if (isTahfidz) statusSectionsHtml += buildExtraCardMinimal("Tahfidz", DB.tahfidzMap[idPps], 'bg-emerald-50/60 border-emerald-100 text-emerald-900');

      // Hint navigasi usap/ketuk
      const navHint = total > 1 ? `<div class="text-[10px] text-slate-400 text-center mt-3 pt-2 border-t border-slate-100 flex items-center justify-center gap-1"><span>👈 Usap / ketuk tepi kartu untuk berpindah 👉</span></div>` : '';

      // KARTU NAMA MINIMALIS TEMPLATE
      const card = `
      <div class="card-perspective relative select-none">
        <div id="cardFlipWrapper" 
             class="card-flip-container bg-white rounded-2xl border border-slate-200 shadow-md p-5 cursor-pointer"
             ontouchstart="handleCardTouchStart(event)" 
             ontouchmove="handleCardTouchMove(event)" 
             ontouchend="handleCardTouchEnd(event)" 
             onclick="handleCardClick(event)">
          
          <!-- ID Card Header (Foto Thumbnail + Nama + ID) -->
          <div class="flex items-center gap-4 pb-4 border-b border-slate-100">
            <!-- Thumbnail Foto -->
            <div class="relative group cursor-pointer flex-shrink-0" onclick="openPhotoModal()">
              ${safeFotoUrl ? `
                <img src="${safeFotoUrl}" alt="Thumbnail Santri" class="w-16 h-16 rounded-2xl object-cover border-2 border-emerald-500 shadow-sm hover:scale-105 transition-transform">
              ` : `
                <div class="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-xl border-2 border-emerald-200">
                  ${nama.charAt(0).toUpperCase()}
                </div>
              `}
              <div class="absolute inset-0 bg-slate-900/30 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-[10px] font-bold">
                 🔎 Zoom
              </div>
            </div>

            <!-- Info Dasar -->
            <div class="flex-grow min-w-0">
              <span class="text-[10px] font-bold tracking-wider text-emerald-600 uppercase">ID PPS: ${idPps || '-'}</span>
              <h2 class="text-lg font-bold text-slate-800 truncate leading-snug">${nama}</h2>
              <div class="flex flex-wrap gap-1 mt-1">${statusBadges.join(' ')}</div>
            </div>
          </div>

          <!-- Detail Data Santri -->
          <div class="mt-3">
            ${detailUtamaHtml}
          </div>

          ${statusSectionsHtml}

          <!-- Footer Kartu Nama (Ikon WA & Action) -->
          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-[11px] text-slate-400 font-medium mr-1">Hubungi:</span>
              ${buatTombolWA(infoKontakWali)}
            </div>
            <button onclick="openPhotoModal()" 
                    class="text-[11px] text-emerald-600 hover:text-emerald-700 font-semibold underline">
              Lihat Foto &raquo;
            </button>
          </div>

          ${navHint}
        </div>
      </div>`;
      
      container.innerHTML = card;
    }

    let isCardAnimating = false;
    let cardStartX = 0;
    let cardStartY = 0;
    let cardDeltaX = 0;

    function changeCard(dir) {
      if (isCardAnimating) return;
      const newIndex = currentCardIndex + dir;
      if (newIndex < 0 || newIndex >= searchResults.length) return;

      const wrapper = document.getElementById('cardFlipWrapper');
      if (!wrapper) {
        currentCardIndex = newIndex;
        renderCurrentCard();
        return;
      }

      isCardAnimating = true;
      const outClass = dir > 0 ? 'flip-out-left' : 'flip-out-right';
      const inClass = dir > 0 ? 'flip-in-right' : 'flip-in-left';

      wrapper.classList.add(outClass);

      setTimeout(() => {
        currentCardIndex = newIndex;
        renderCurrentCard();
        const newWrapper = document.getElementById('cardFlipWrapper');
        if (newWrapper) {
          newWrapper.classList.add(inClass);
          setTimeout(() => {
            newWrapper.classList.remove(inClass);
            isCardAnimating = false;
          }, 250);
        } else {
          isCardAnimating = false;
        }
      }, 150);
    }

    function nextCard() {
      changeCard(1);
    }

    function prevCard() {
      changeCard(-1);
    }

    function handleCardTouchStart(e) {
      if (e.touches.length === 1) {
        cardStartX = e.touches[0].clientX;
        cardStartY = e.touches[0].clientY;
        cardDeltaX = 0;
        const wrapper = document.getElementById('cardFlipWrapper');
        if (wrapper) wrapper.style.transition = 'none';
      }
    }

    function handleCardTouchMove(e) {
      if (!cardStartX) return;
      const currentX = e.touches[0].clientX;
      const currentY = e.touches[0].clientY;
      const diffX = currentX - cardStartX;
      const diffY = currentY - cardStartY;

      // Gerakan rotasi miring mengikuti sentuhan layar secara horizontal
      if (Math.abs(diffX) > Math.abs(diffY)) {
        cardDeltaX = diffX;
        const wrapper = document.getElementById('cardFlipWrapper');
        if (wrapper) {
          const rotateY = Math.min(Math.max((cardDeltaX / wrapper.clientWidth) * 50, -50), 50);
          wrapper.style.transform = `rotateY(${rotateY}deg)`;
        }
      }
    }

    function handleCardTouchEnd(e) {
      const wrapper = document.getElementById('cardFlipWrapper');
      if (wrapper) {
        wrapper.style.transition = '';
        wrapper.style.transform = '';
      }

      if (Math.abs(cardDeltaX) > 40) {
        if (cardDeltaX < 0) {
          nextCard();
        } else {
          prevCard();
        }
      }
      cardStartX = 0;
      cardStartY = 0;
      cardDeltaX = 0;
    }

    function handleCardClick(e) {
      // Abaikan jika yang diklik adalah tombol/ikon interaktif (WA, Zoom, dll)
      if (e.target.closest('button, a, input, .group')) return;

      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX > rect.width / 2) {
        nextCard();
      } else {
        prevCard();
      }
    }

    function buildExtraCardMinimal(title, dataObj, colorClass) {
      let items = '';
      for (let key in dataObj) {
        items += `
          <div class="py-1 flex justify-between text-[11px]">
            <span class="opacity-70">${key}:</span>
            <span class="font-semibold">${dataObj[key]}</span>
          </div>`;
      }

      return `
        <div class="mt-3 p-3 rounded-xl border ${colorClass}">
          <h4 class="font-bold text-xs mb-1 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-current"></span>Rincian ${title}
          </h4>
          <div class="divide-y divide-black/5">
            ${items || '<span class="text-[10px] opacity-60">Tidak ada rincian.</span>'}
          </div>
        </div>`;
    }

    // Google Drive Safe Thumbnail API Generator
    function getSafeImageUrl(rawUrl) {
      if (!rawUrl) return "";
      let url = rawUrl.trim();
      let fileId = "";

      let match1 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match1) fileId = match1[1];

      let match2 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (!fileId && match2) fileId = match2[1];

      let match3 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (!fileId && match3) fileId = match3[1];

      if (fileId) {
        return `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
      }
      return url;
    }

    // MEMBUAT TOMBOL IKON WA SAJA (SUPPORT 1 ATAU 2 NOMOR TERPISAH)
    function buatTombolWA(kolomKontak) {
      if (!kolomKontak || kolomKontak.trim() === "") {
        return `<span class="text-slate-300 text-xs">-</span>`;
      }

      let nomorArray = kolomKontak.split(/[;,]+/);
      let kumpulanTombol = '';

      nomorArray.forEach(nomor => {
        let nomorBersih = nomor.trim().replace(/[\s\-\+]/g, '');

        if (nomorBersih.startsWith('0')) {
          nomorBersih = '62' + nomorBersih.substring(1);
        }

        if (nomorBersih.length > 7) {
          kumpulanTombol += `
            <a href="https://wa.me/${nomorBersih}" target="_blank" rel="noopener noreferrer" 
               title="Hubungi WhatsApp (${nomorBersih})"
               class="w-8 h-8 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white flex items-center justify-center shadow transition-transform hover:scale-110 active:scale-95">
               <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">

    // OPEN PHOTO MODAL DENGAN BOUNCE ANIMATION
    function openPhotoModal() {
      if (searchResults.length === 0 || !searchResults[currentCardIndex]) return;
      const santriPilih = searchResults[currentCardIndex];
      const idPps = santriPilih[0] ? santriPilih[0].trim() : '-';
      const nama = santriPilih[1] ? santriPilih[1].trim() : 'Tanpa Nama';

      // Ambil data Domisili (bukan Status Domisili)
      const domisiliIndex = DB.headersUtama.findIndex(header => header.trim().toUpperCase() === "DOMISILI");
      let domisiliVal = (domisiliIndex !== -1 && santriPilih[domisiliIndex]) ? santriPilih[domisiliIndex] : "";

      document.getElementById('modalName').innerText = nama;
      document.getElementById('modalPps').innerText = "ID PPS: " + idPps;
      document.getElementById('modalDomisili').innerText = domisiliVal ? "Domisili: " + domisiliVal : "";

      const modal = document.getElementById('photoModal');
      const modalCard = document.getElementById('photoModalCard');
      const img = document.getElementById('santriImg');
      const loading = document.getElementById('photoLoading');
      const errorDiv = document.getElementById('photoError');

      // Reset Modal State
      img.classList.add('hidden');
      errorDiv.classList.add('hidden');
      loading.classList.remove('hidden');
      img.src = "";
      
      // Tambahkan efek bounce animation
      modalCard.classList.remove('animate-bounce-modal');
      void modalCard.offsetWidth; // trigger reflow
      modalCard.classList.add('animate-bounce-modal');

      modal.classList.remove('hidden');

      const fotoIndex = DB.headersUtama.findIndex(header => header.toUpperCase() === "FOTO");

      if (fotoIndex !== -1 && santriPilih[fotoIndex] && santriPilih[fotoIndex] !== "") {
        const safeUrl = getSafeImageUrl(santriPilih[fotoIndex]);
        img.src = safeUrl;
      } else {
        showPhotoError("Foto belum tersedia di database.");
      }
    }

    function onImageLoaded() {
      document.getElementById('photoLoading').classList.add('hidden');
      document.getElementById('santriImg').classList.remove('hidden');
    }

    function onImageError() {
      showPhotoError("Gagal memuat file foto.");
    }

    function showPhotoError(msg) {
      document.getElementById('photoLoading').classList.add('hidden');
      document.getElementById('santriImg').classList.add('hidden');
      document.getElementById('photoErrorMsg').innerText = msg;
      document.getElementById('photoError').classList.remove('hidden');
    }

    function closePhotoModal() {
      document.getElementById('photoModal').classList.add('hidden');
    }
  </script>
