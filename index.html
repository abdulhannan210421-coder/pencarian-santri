<!DOCTYPE html>
<html lang="id" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="a8VwvtD9EcW8vkh2b7SiWVIPnScssr8ODeT2SKiuTmU" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pencarian Data Santri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    #scrollableArea {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }
  </style>
</head>
<body class="bg-slate-100">
  <div id="scrollableArea" class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-6 my-2">
      <div class="flex justify-between items-center mb-4">
        <span id="cacheBadge" class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full hidden">Data Tersimpan (Siap Pakai)</span>
        <button onclick="forceRefreshData()" class="text-xs text-gray-400 hover:text-emerald-600 underline ml-auto">
          🔄 Update Data Terbaru
        </button>
      </div>

      <h1 class="text-2xl md:text-3xl font-bold text-center text-emerald-700 mb-2">Pencarian Data Santri</h1>
      <p class="text-center text-gray-500 mb-6 text-sm">Cari berdasarkan <strong>ID PPS</strong> atau <strong>Nama Santri</strong></p>

      <div class="flex gap-2 mb-2">
        <input type="text" id="searchInput" placeholder="Ketik minimal 3 huruf atau ID PPS..." 
               class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm disabled:bg-gray-100"
               onkeyup="handleKeyPress(event)" disabled>
        <button onclick="lakukanPencarianFast(true)" id="searchBtn" disabled
                class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-emerald-700 transition shadow-sm disabled:opacity-50">
          Cari
        </button>
      </div>
      <p class="text-xs text-gray-400 mb-6">*Pencarian otomatis berjalan jika mengetik minimal 3 karakter / ID lengkap.</p>

      <div id="loading" class="text-center py-6 text-emerald-600 font-semibold flex items-center justify-center gap-2">
        <svg class="animate-spin h-5 w-5 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span id="loadingText">Memuat data santri...</span>
      </div>

      <div id="infoMessage" class="mb-4"></div>
      <div id="resultContainer" class="space-y-6"></div>
    </div>
  </div>

  <script>
    // ⚠️ PASTE URL GOOGLE APPS SCRIPT KAMU DI SINI:
    const API_URL = "https://script.google.com/macros/s/AKfycbzpmjBCV-wmN-tr3RGh3RvDJ35u1dFnnhBzGUXiQkB6CPPEqOQlCEHZY1uKV9xAYf9zHw/exec";

    const scrollArea = document.getElementById('scrollableArea');
    let startY = 0;

    scrollArea.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) startY = e.touches[0].clientY;
    }, { passive: false });

    scrollArea.addEventListener('touchmove', function(e) {
      const currentY = e.touches[0].clientY;
      const distanceY = currentY - startY;
      if (scrollArea.scrollTop <= 0 && distanceY > 0) e.preventDefault();
    }, { passive: false });

    let DB = { headersUtama: [], dataUtama: [], mutaallimMap: {}, mualimMap: {}, tahfidzMap: {} };

    window.onload = function() {
      const localData = localStorage.getItem('SANTRI_DB_CACHE');
      if (localData) {
        try {
          const parsed = JSON.parse(localData);
          initDatabase(parsed, true);
          fetchDataFromServer(false);
          return;
        } catch(e) {
          localStorage.removeItem('SANTRI_DB_CACHE');
        }
      }
      fetchDataFromServer(true);
    };

    function fetchDataFromServer(showLoadingUI) {
      if(showLoadingUI) document.getElementById('loading').classList.remove('hidden');
      
      fetch(API_URL)
        .then(response => response.json())
        .then(res => {
          localStorage.setItem('SANTRI_DB_CACHE', JSON.stringify(res));
          initDatabase(res, false);
        })
        .catch(err => {
          if(showLoadingUI) {
            document.getElementById('loadingText').innerText = 'Gagal memuat: ' + err.message;
          }
        });
    }

    function forceRefreshData() {
      document.getElementById('loadingText').innerText = "Memperbarui database...";
      document.getElementById('loading').classList.remove('hidden');
      fetchDataFromServer(true);
    }

    function initDatabase(res, isFromCache) {
      DB.headersUtama = res.headersUtama;
      DB.dataUtama = res.dataUtama;
      DB.mutaallimMap = res.mutaallimMap;
      DB.mualimMap = res.mualimMap;
      DB.tahfidzMap = res.tahfidzMap;

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('searchInput').disabled = false;
      document.getElementById('searchBtn').disabled = false;
      
      if(isFromCache) document.getElementById('cacheBadge').classList.remove('hidden');
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") lakukanPencarianFast(true);
      else lakukanPencarianFast(false);
    }

    function lakukanPencarianFast(isForce) {
      const inputEl = document.getElementById('searchInput');
      const keyword = inputEl.value.toLowerCase().trim();
      const container = document.getElementById('resultContainer');
      const infoMsg = document.getElementById('infoMessage');
      
      container.innerHTML = '';
      infoMsg.innerHTML = '';

      if (!keyword) return;
      if (!isForce && keyword.length < 3) return;

      const hasil = DB.dataUtama.filter(row => {
        const idPps = row[0] ? row[0].toLowerCase().trim() : "";
        const nama = row[1] ? row[1].toLowerCase().trim() : ""; 
        return idPps.includes(keyword) || nama.includes(keyword);
      });

      if (hasil.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 py-8 bg-gray-50 rounded-lg border border-dashed border-gray-300">Data santri tidak ditemukan.</div>`;
        return;
      }

      const maxLimit = 30;
      const displayHasil = hasil.slice(0, maxLimit);

      if (hasil.length > maxLimit) {
        infoMsg.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs p-3 rounded-lg">
            Ditemukan <strong>${hasil.length}</strong> data. Menampilkan <strong>30 data pertama</strong> agar cepat. Ketik nama lebih spesifik jika belum muncul.
          </div>
        `;
      }

      displayHasil.forEach(row => {
        const idPps = row[0] ? row[0].trim() : "";
        const nama = row[1] ? row[1].trim() : "Tanpa Nama";

        const isMutaallim = DB.mutaallimMap.hasOwnProperty(idPps);
        const isMualim = DB.mualimMap.hasOwnProperty(idPps);
        const isTahfidz = DB.tahfidzMap.hasOwnProperty(idPps);

        let statusBadges = [];
        if (isMutaallim) statusBadges.push(`<span class="px-3 py-1 text-xs font-bold rounded-full border bg-amber-100 text-amber-800 border-amber-300">Muta'allim</span>`);
        if (isMualim) statusBadges.push(`<span class="px-3 py-1 text-xs font-bold rounded-full border bg-blue-100 text-blue-800 border-blue-300">Mu'allim</span>`);
        if (isTahfidz) statusBadges.push(`<span class="px-3 py-1 text-xs font-bold rounded-full border bg-emerald-100 text-emerald-800 border-emerald-300">Tahfidz</span>`);
        if (statusBadges.length === 0) statusBadges.push(`<span class="px-3 py-1 text-xs font-bold rounded-full border bg-gray-100 text-gray-800 border-gray-300">Santri Regular</span>`);

        let detailUtamaHtml = '';
        DB.headersUtama.forEach((header, idx) => {
          let val = (row[idx] !== "" && row[idx] !== null && row[idx] !== undefined) ? row[idx] : "-";
          detailUtamaHtml += `
            <div class="bg-white p-2 rounded border border-gray-200">
              <span class="block text-xs font-bold text-gray-400 uppercase tracking-wider">${header}</span>
              <span class="text-sm font-medium text-gray-800">${val}</span>
            </div>
          `;
        });

        let statusSectionsHtml = '';
        if (isMutaallim) statusSectionsHtml += buildExtraCard("Data Muta'allim", DB.mutaallimMap[idPps], "border-amber-200 bg-amber-50/50 text-amber-800");
        if (isMualim) statusSectionsHtml += buildExtraCard("Data Mu'allim", DB.mualimMap[idPps], "border-blue-200 bg-blue-50/50 text-blue-800");
        if (isTahfidz) statusSectionsHtml += buildExtraCard("Data Tahfidz", DB.tahfidzMap[idPps], "border-emerald-200 bg-emerald-50/50 text-emerald-800");

        const card = `
          <div class="border border-gray-200 rounded-xl p-5 bg-gray-50 shadow-sm hover:shadow-md transition">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 mb-4 pb-3 border-b border-gray-200">
              <div>
                <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wide">ID PPS: ${idPps || '-'}</span>
                <h2 class="text-xl font-bold text-gray-800">${nama}</h2>
              </div>
              <div class="flex flex-wrap gap-1">${statusBadges.join(' ')}</div>
            </div>

            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Informasi Utama Santri</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-4">
              ${detailUtamaHtml}
            </div>

            ${statusSectionsHtml}
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function buildExtraCard(title, dataObj, colorClass) {
      let items = '';
      for (let key in dataObj) {
        items += `
          <div class="bg-white p-2 rounded border border-gray-200">
            <span class="block text-xs font-bold text-gray-400 uppercase tracking-wider">${key}</span>
            <span class="text-sm font-medium text-gray-800">${dataObj[key]}</span>
          </div>
        `;
      }

      return `
        <div class="mt-4 p-4 border rounded-lg ${colorClass}">
          <h4 class="font-bold text-sm mb-3 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-current"></span> ${title}
          </h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            ${items || '<span class="text-xs text-gray-400">Tidak ada rincian tambahan.</span>'}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
